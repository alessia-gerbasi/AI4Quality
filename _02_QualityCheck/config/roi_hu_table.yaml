# ROI table: procedure code → structures to segment per phase
#
# arteriosa: segment when phase_name == "arteriosa"
# venosa:    segment when phase_name == "venosa"
# monitoring/basale/empty/other: segment union of arteriosa + venosa
#
# Values must be canonical TotalSegmentator label names.
# "no" or empty list means nothing to segment for that phase.
#
# 

TACPEC:
  arteriosa: [aorta]
  HU_arteriosa: [300,500,250,600] # min, max, min with threshold, max with threshold
  venosa: [liver, spleen]
  HU_venosa: [100,120,90,150]
  HU_delta_venosa: [50,60,40,80] # if basale available

