[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4quality"
version = "0.1.0"
description = "AI4Quality preprocessing pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydicom>=2.4.4",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "PyYAML>=6.0.2"
]

[tool.setuptools]
include-package-data = true
