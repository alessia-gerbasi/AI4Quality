name: "Timing Analysis"
description: "Diagnose timing-related quality failures - arterial vs venous phase"

# Variables: three ways to define them
#
#  1. @{Column Name With Spaces}  - direct Excel column reference
#     @simple_name                - same, for columns without spaces
#
#  2. source: roi_hu_timing_table - threshold lookup from config/common/ct_protocols.yaml
#     Procedure is read automatically from "Order Procedure" Excel column.
#     index: 0 = min_optimal, 1 = max_optimal, 2 = min_acceptable, 3 = max_acceptable
#
#  3. calculation: mixing @columns and $phase.field.index inline
#     $arteriosa.timing.0  ->  thresholds[procedure]['arteriosa']['timing'][0]

variables:
  # From Excel columns (exact column names from injection history)
  contrast_volume_ml:
    calculation: "@{Total Contrast Injected (mL)}"
    unit: mL
  flow_rate:
    calculation: "@{Actual Contrast Avg Rate (mL/s)}"
    unit: mL/s
  injection_duration_s:
    calculation: "@{Actual Total Duration (s)}"
    unit: seconds
  access_type:
    calculation: "@{Needle Access}"

  # Threshold lookups — values come from config/common/ct_protocols.yaml for the current procedure
  arterial_timing_min:
    source: roi_hu_timing_table
    phase: arteriosa
    field: timing
    index: 0
  arterial_timing_max:
    source: roi_hu_timing_table
    phase: arteriosa
    field: timing
    index: 1
  arterial_timing_min_threshold:
    source: roi_hu_timing_table
    phase: arteriosa
    field: timing
    index: 2
  arterial_timing_max_threshold:
    source: roi_hu_timing_table
    phase: arteriosa
    field: timing
    index: 3

  # Example derived calculation (commented out until columns are confirmed):
  # contrast_dose_per_kg:
  #   calculation: "@{Total Contrast Injected (mL)} / @{Patient Weight}"

decisions:
  root:
    question: "Is injection duration within arterial window"
    condition: "@injection_duration_s >= @arterial_timing_min AND @injection_duration_s <= @arterial_timing_max"
    if_true: outcome_timing_ok_arterial
    if_false: check_direction

  check_direction:
    question: "Did acquisition start too early?"
    condition: "@injection_duration_s < @arterial_timing_min"
    if_true: outcome_early
    if_false: outcome_late

outcomes:
  outcome_timing_ok_arterial:
    label: "timing_ok"
    card:
      title: "\u2713 Timing within arterial window"
      explanation: "Acquisition started at optimal time for bolus arrival at ROI"
      impact: "Quality not limited by timing. Expected good arterial enhancement."
      recommendations: []

  outcome_early:
    label: "early"
    card:
      title: "\u26a0 Acquisition started too early"
      explanation: "Bolus has not yet arrived at ROI when acquisition began"
      impact: "Suboptimal HU enhancement in arterial phase, poor image quality"
      recommendations:
        - "Increase injection-to-acquisition delay in protocol"
        - "Verify patient bolus arrival time vs protocol expectation"
        - "Check if bolus tracking was used (if available)"

  outcome_late:
    label: "late"
    card:
      title: "\u26a0 Acquisition started too late"
      explanation: "Bolus already peaked and washing out when acquisition started"
      impact: "Reduced arterial enhancement, poor tissue discrimination, venous contamination"
      recommendations:
        - "Decrease injection-to-acquisition delay in protocol"
        - "Consider reducing bolus volume or increasing injection rate"
        - "Review patient-specific anatomy delays"
